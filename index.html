<!DOCTYPE html>
<html lang="zh-CN" data-theme="ivory">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="《降临》第一卷正文阅读站 —— 主神陨落极北之后，与白发守门人、护主狂狐、老猫狐城主共度的三十个日夜。">
  <title>降临 · 第一卷</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.loli.net" crossorigin>
  <link rel="stylesheet" href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="/styles.css">
  <script>
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem('novel_prefs_v1') || '{}');
        if (saved.theme) document.documentElement.setAttribute('data-theme', saved.theme);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="reading-progress" aria-hidden="true"></div>

  <!-- Minimal Translucent Top Bar (Shown in Reader View, auto-hides while reading) -->
  <header id="topbar" class="topbar" aria-label="阅读导航">
    <div class="topbar-inner">
      <div class="topbar-left">
        <a href="/" id="nav-home" class="brand-link" title="返回封面与目录">
          <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path d="M15.5 4.5a7.5 7.5 0 1 0 4 13.8 6.5 6.5 0 0 1-4-13.8z"/>
            <path d="M18 6l.7 1.8L20.5 8.5l-1.8.7L18 11l-.7-1.8-1.8-.7 1.8-.7L18 6z"/>
          </svg>
          <span class="brand-name">降临</span>
        </a>
        <span class="topbar-divider" aria-hidden="true">/</span>
        <span id="topbar-chapter-title" class="topbar-chapter-title"></span>
      </div>
      <div class="topbar-actions">
        <button type="button" id="btn-toc" class="icon-btn" aria-label="打开目录" title="目录">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h10"/>
          </svg>
          <span class="btn-label">目录</span>
        </button>
        <button type="button" id="btn-appearance" class="icon-btn" aria-label="阅读设置" aria-expanded="false" title="排版与主题">
          <span class="aa-glyph">Aa</span>
        </button>
        <button type="button" id="btn-theme-toggle" class="icon-btn" aria-label="切换日夜模式" title="日夜切换">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4 7 7 0 0 0 20 14.5z"/>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Compact Appearance Popover -->
  <div id="appearance-popover" class="popover" role="dialog" aria-label="阅读外观设置" hidden>
    <div class="popover-row">
      <span class="popover-label">纸色</span>
      <div class="theme-pills">
        <button type="button" class="theme-chip" data-theme-choice="ivory">晨曦</button>
        <button type="button" class="theme-chip" data-theme-choice="cocoa">暖茶</button>
        <button type="button" class="theme-chip" data-theme-choice="night">星夜</button>
      </div>
    </div>
    <div class="popover-row">
      <span class="popover-label">字号</span>
      <div class="stepper">
        <button type="button" id="font-dec" aria-label="减小字号">A-</button>
        <span id="font-size-val">18</span>
        <button type="button" id="font-inc" aria-label="增大字号">A+</button>
      </div>
    </div>
    <div class="popover-row">
      <span class="popover-label">字体</span>
      <div class="seg-group">
        <button type="button" class="seg-btn" data-font-choice="serif">宋体</button>
        <button type="button" class="seg-btn" data-font-choice="sans">黑体</button>
      </div>
    </div>
    <div class="popover-row">
      <span class="popover-label">首行缩进</span>
      <button type="button" id="btn-indent" class="toggle-pill" aria-pressed="false">关闭</button>
    </div>
  </div>

  <!-- Home / Cover & Index View -->
  <main id="home-view" class="home-view" hidden>
    <div class="home-ambient" aria-hidden="true"></div>
    <div class="home-shell">
      <div class="home-top-controls">
        <button type="button" id="home-theme-btn" class="quiet-control" aria-label="切换主题">
          <span id="home-theme-text">星夜模式</span>
        </button>
      </div>

      <section class="hero" aria-labelledby="book-title">
        <div class="hero-emblem" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.2">
            <path d="M28 10a14 14 0 1 0 9.8 24 11.5 11.5 0 0 1-9.8-24z"/>
            <path d="M35 12l1 2.8 2.8 1-2.8 1-1 2.8-1-2.8-2.8-1 2.8-1 1-2.8z"/>
          </svg>
        </div>
        <p class="hero-volume">第一卷</p>
        <h1 id="book-title" class="hero-title">降 临</h1>
        <p id="book-epigraph" class="hero-epigraph">主神陨落极北之后，与白发守门人、护主狂狐、老猫狐城主共度的三十个日夜。</p>
        <div class="hero-actions">
          <a href="?c=1" id="hero-primary-cta" class="primary-cta">开始阅读</a>
          <a href="#index-section" class="secondary-cta">卷目一览</a>
        </div>
      </section>

      <div class="hairline-rule" aria-hidden="true"><span>✦</span></div>

      <section id="index-section" class="toc-section" aria-label="章节目录">
        <div id="home-toc-container" class="home-toc-container"></div>
      </section>

      <footer class="site-footer">
        <span>第一卷 · 凡三十章</span>
      </footer>
    </div>
  </main>

  <!-- Reader View -->
  <main id="reader-view" class="reader-view" hidden>
    <article class="article-container" id="article-container">
      <header class="chapter-header">
        <p id="chapter-kicker" class="chapter-kicker"></p>
        <h1 id="chapter-heading" class="chapter-heading"></h1>
        <div class="chapter-divider" aria-hidden="true"></div>
      </header>

      <div id="chapter-body" class="chapter-body"></div>

      <nav class="chapter-footer-nav" aria-label="章节翻页">
        <div class="scene-break footer-ornament" aria-hidden="true"><span>✦</span></div>
        <div id="footer-next-card" class="footer-next-wrap"></div>
        <div class="footer-links">
          <a href="#" id="footer-prev" class="footer-link">上一章</a>
          <a href="/" id="footer-toc" class="footer-link">返回目录</a>
          <a href="#" id="footer-next" class="footer-link">下一章</a>
        </div>
      </nav>
    </article>
  </main>

  <!-- Slide-over TOC Drawer -->
  <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
  <aside id="toc-drawer" class="toc-drawer" aria-label="全卷目录" hidden>
    <div class="drawer-header">
      <div>
        <span class="drawer-kicker">第一卷</span>
        <h2 class="drawer-title">降 临</h2>
      </div>
      <button type="button" id="btn-close-drawer" class="close-btn" aria-label="关闭目录">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div id="drawer-toc-list" class="drawer-list"></div>
  </aside>

  <script src="/app.js" defer></script>
</body>
</html>
