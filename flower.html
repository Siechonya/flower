    display:none; align-items:center; justify-content:center; touch-action:none;

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------- 基础工具 ----------
const lerp = (a,b,t)=>a+(b-a)*t;
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const damp = (a,b,lambda,dt)=>a+(b-a)*(1-Math.exp(-lambda*dt));
const smoothstep = (a,b,v)=>{ const t=clamp((v-a)/(b-a),0,1); return t*t*(3-2*t); };
function terrainHeight(x,z){
  return 1.5*Math.sin(x*0.05)*Math.cos(z*0.07)
       + 2.2*Math.sin(x*0.12+1.3)*Math.sin(z*0.10+0.5)
       + 1.0*Math.sin(x*0.23+2.0)*Math.cos(z*0.19+1.0)
       + 0.6*Math.sin(x*0.37)*Math.cos(z*0.31);
}

// ---------- 云影贴图（可平铺 FBM） ----------
function hash2i(ix,iy){
  let n = (ix|0)*374761393 + (iy|0)*668265263;
  n = (n ^ (n>>13)) * 1274126177;
  n = n ^ (n>>16);
  return (n >>> 0) / 4294967296;
}
function periodicNoise(x,y,period){
  const x0=Math.floor(x), y0=Math.floor(y);
  const tx=x-x0, ty=y-y0;
  const sx=tx*tx*(3-2*tx), sy=ty*ty*(3-2*ty);
  const px=((x0%period)+period)%period, py=((y0%period)+period)%period;
  const nx=(px+1)%period, ny=(py+1)%period;
  const v00=hash2i(px,py), v10=hash2i(nx,py), v01=hash2i(px,ny), v11=hash2i(nx,ny);
  return lerp(lerp(v00,v10,sx), lerp(v01,v11,sx), sy);
}
function fbmPeriodic(x,y,period,oct){
  let v=0, a=0.5, f=1;
  for(let o=0;o<oct;o++){
    const p=Math.max(1, Math.round(period*f));
    v += a*periodicNoise(x*f, y*f, p);
    f *= 2; a *= 0.5;
  }
  return v;
}
function generateCloudShadowTexture(size){
  const canvas=document.createElement('canvas'); canvas.width=canvas.height=size;
  const ctx=canvas.getContext('2d'); const img=ctx.createImageData(size,size);
  const period=8;
  for(let y=0;y<size;y++){
    for(let x=0;x<size;x++){
      const nx=(x/size)*period, ny=(y/size)*period;
      let v=fbmPeriodic(nx,ny,period,5);
      v=smoothstep(0.42,0.78,v);
      const i=(y*size+x)*4;
      img.data[i]=img.data[i+1]=img.data[i+2]=Math.round(v*255);
      img.data[i+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
  const tex=new THREE.CanvasTexture(canvas);
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
  return tex;
}

// ---------- 渲染器 / 场景 / 相机 ----------
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
const QUALITY_PRESETS = {
  low:    { pixelRatio: 1.0, cloudSteps: 22, maxCloudSteps: 28 },
  medium: { pixelRatio: 1.5, cloudSteps: 32, maxCloudSteps: 40 },
  high:   { pixelRatio: Math.min(window.devicePixelRatio || 1, 2.5), cloudSteps: 40, maxCloudSteps: 52 }
};
let currentQuality = 'high';
renderer.setPixelRatio(QUALITY_PRESETS[currentQuality].pixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe0ff);
scene.fog = new THREE.FogExp2(0xcfe8ff, 0.0035);

const camera = new THREE.PerspectiveCamera(62, window.innerWidth/window.innerHeight, 0.1, 50000);
camera.position.set(0, 8, 16);
function applyCameraFov(){
  const aspect = window.innerWidth / window.innerHeight;
  camera.aspect = aspect;
  camera.fov = aspect < 1 ? 78 : 62;
  camera.updateProjectionMatrix();
}
applyCameraFov();

const sunDir = new THREE.Vector3(-0.45, 0.68, 0.35).normalize();

const sunLight = new THREE.DirectionalLight(0xfff2dd, 3.0);
sunLight.position.copy(sunDir).multiplyScalar(200);
scene.add(sunLight);
scene.add(new THREE.AmbientLight(0x8899aa, 0.9));
scene.add(new THREE.HemisphereLight(0xbfd9ff, 0x6a994e, 0.8));

// ---------- 天空穹顶 ----------
const skyMat = new THREE.ShaderMaterial({
  side:THREE.BackSide, depthWrite:false, depthTest:false, renderOrder:-100,
  uniforms:{
    uSunDir:{value:sunDir.clone()},
    uSunIntensity:{value:1.0},
    uSkyTop:{value:new THREE.Color(0x3b8fd4)},
    uSkyHorizon:{value:new THREE.Color(0xbfe0ff)},
    uTime:{value:0}
  },
  vertexShader:`varying vec3 vDir;
    void main(){ vDir=position; vec4 wp=modelMatrix*vec4(position,1.0); gl_Position=projectionMatrix*viewMatrix*wp; }`,
  fragmentShader:`uniform vec3 uSunDir; uniform float uSunIntensity; uniform vec3 uSkyTop; uniform vec3 uSkyHorizon; uniform float uTime; varying vec3 vDir;
    void main(){
      vec3 d=normalize(vDir);
      float h=clamp(d.y,0.0,1.0);
      vec3 col=mix(uSkyHorizon,uSkyTop,pow(h,0.62));
      float cir=sin(d.x*70.0+uTime*0.35)*sin(d.z*60.0-uTime*0.22)*0.5+0.5;
      col=mix(col,vec3(0.85,0.9,0.95),cir*0.16*(1.0-h));
      float s=max(dot(d,normalize(uSunDir)),0.0001);
      col += vec3(1.0,0.85,0.62)*(pow(s,2500.0)*3.5 + pow(s,90.0)*0.13)*uSunIntensity;
      gl_FragColor=vec4(col,1.0);
    }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(30000, 48, 24), skyMat);
sky.frustumCulled=false;
sky.renderOrder=-100;
scene.add(sky);

// ---------- 体积云层 ----------
const cloudMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, side:THREE.DoubleSide, renderOrder:-50,
  uniforms:{
    uTime:{value:0},
    uSunDir:{value:sunDir.clone()},
    uSunIntensity:{value:1.0},
    uCloudColor:{value:new THREE.Color(0xffffff)},
    uSkyColor:{value:new THREE.Color(0xbfe0ff)},
    uCoverage:{value:0.35},
    uDensity:{value:0.9},
    uCloudBase:{value:80.0},
    uCloudTop:{value:170.0},
    uStepCount:{value:36.0}
  },
  vertexShader:`varying vec3 vWorldPos;
    void main(){ vec4 wp=modelMatrix*vec4(position,1.0); vWorldPos=wp.xyz; gl_Position=projectionMatrix*viewMatrix*wp; }`,
  fragmentShader:`uniform float uTime; uniform vec3 uSunDir; uniform float uSunIntensity; uniform vec3 uCloudColor; uniform vec3 uSkyColor; uniform float uCoverage; uniform float uDensity; uniform float uCloudBase; uniform float uCloudTop; uniform float uStepCount; varying vec3 vWorldPos;
    float hash(vec3 p){ return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453123); }
    float vnoise(vec3 p){ vec3 i=floor(p); vec3 f=fract(p); f=f*f*(3.0-2.0*f);
      return mix(mix(mix(hash(i+vec3(0.0,0.0,0.0)),hash(i+vec3(1.0,0.0,0.0)),f.x),
                     mix(hash(i+vec3(0.0,1.0,0.0)),hash(i+vec3(1.0,1.0,0.0)),f.x),f.y),
                 mix(mix(hash(i+vec3(0.0,0.0,1.0)),hash(i+vec3(1.0,0.0,1.0)),f.x),
                     mix(hash(i+vec3(0.0,1.0,1.0)),hash(i+vec3(1.0,1.0,1.0)),f.x),f.y),f.z);
    }
    float fbm(vec3 p){ float v=0.0; float a=0.5; for(int i=0;i<5;i++){ v+=a*vnoise(p); p=p*2.02+vec3(0.71,0.0,0.37); a*=0.5; } return v; }
    void main(){
      vec3 ro=cameraPosition;
      vec3 rd=normalize(vWorldPos-ro);
      if(rd.y<0.001) discard;
      float t0=(uCloudBase-ro.y)/rd.y;
      float t1=(uCloudTop-ro.y)/rd.y;
      if(t1<0.0) discard;
      t0=max(t0,0.0); t1=min(t1,60000.0);
      if(t1<=t0) discard;
      float stepLen=(t1-t0)/uStepCount;
      float t=t0+stepLen*fract(sin(dot(gl_FragCoord.xy,vec2(12.9898,78.233)))*43758.5453);
      float trans=1.0; float lightSum=0.0;
      vec3 sd=normalize(uSunDir);
      float cosAng=dot(rd,sd);
      float phase=0.3+0.7*pow(1.0-cosAng*cosAng,1.5);
      float cover=clamp(uCoverage,0.05,1.0);
      for(int i=0;i<80;i++){
        if(float(i)>=uStepCount) break;
        vec3 p=ro+rd*t;
        float h=clamp((p.y-uCloudBase)/(uCloudTop-uCloudBase),0.0,1.0);
        float hg=smoothstep(0.0,0.15,h)*(1.0-smoothstep(0.72,1.0,h));
        vec3 q=p*0.010+vec3(uTime*0.008,0.0,uTime*0.005);
        float n=fbm(q);
        float density=max(0.0,n-(1.0-cover*1.25));
        density*=uDensity*hg;
        density=clamp(density,0.0,1.0);
        if(density>0.001){
          float sunTrans=exp(-density*uDensity*1.5);
          lightSum += density*stepLen*trans*(0.12+uSunIntensity*phase*sunTrans*1.6);
          trans *= exp(-density*stepLen*uDensity*2.2);
          if(trans<0.03) break;
        }
        t+=stepLen;
      }
      float alpha=clamp(1.0-trans,0.0,1.0);
      vec3 col=mix(uSkyColor,uCloudColor,alpha);
      col += vec3(1.0,0.92,0.78)*clamp(lightSum,0.0,1.0)*alpha*1.1;
      gl_FragColor=vec4(col,alpha);
    }`
});
const cloudPlane = new THREE.Mesh(new THREE.PlaneGeometry(24000,24000), cloudMat);
cloudPlane.rotation.x = -Math.PI/2;
cloudPlane.position.y = 130;
cloudPlane.frustumCulled = false;
cloudPlane.renderOrder = -50;
scene.add(cloudPlane);

// ---------- 地形 ----------
const cloudShadowTex = generateCloudShadowTexture(512);
const terrainMat = new THREE.ShaderMaterial({
  uniforms:{
    uTime:{value:0},
    uSunDir:{value:sunDir.clone()},
    uSunIntensity:{value:1.0},
    uWindStrength:{value:0.4},
    uColorLow:{value:new THREE.Color(0x4c7a34)},
    uColorHigh:{value:new THREE.Color(0x93c14e)},
    uColorPatch1:{value:new THREE.Color(0x6da33d)},
    uColorPatch2:{value:new THREE.Color(0xaad06b)},
    uCloudShadow:{value:cloudShadowTex},
    uCloudShadowScale:{value:0.02},
    uCloudShadowStrength:{value:0.25},
    uFogColor:{value:new THREE.Color(0xcfe8ff)},
    uFogDensity:{value:0.0035}
  },
  vertexShader:`varying vec2 vUv; varying vec3 vWorldPos; varying vec3 vNormal; varying float vHeight;
    void main(){ vec4 wp=modelMatrix*vec4(position,1.0); vWorldPos=wp.xyz; vNormal=normalize(mat3(modelMatrix)*normal); vHeight=position.y; vUv=uv; gl_Position=projectionMatrix*viewMatrix*wp; }`,
  fragmentShader:`uniform float uTime; uniform vec3 uSunDir; uniform float uSunIntensity; uniform float uWindStrength;
    uniform vec3 uColorLow; uniform vec3 uColorHigh; uniform vec3 uColorPatch1; uniform vec3 uColorPatch2;
    uniform sampler2D uCloudShadow; uniform float uCloudShadowScale; uniform float uCloudShadowStrength;
    uniform vec3 uFogColor; uniform float uFogDensity;
    varying vec2 vUv; varying vec3 vWorldPos; varying vec3 vNormal; varying float vHeight;
    float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123); }
    float vnoise(vec2 p){ vec2 i=floor(p); vec2 f=fract(p); f=f*f*(3.0-2.0*f);
      return mix(mix(hash(i+vec2(0.0,0.0)),hash(i+vec2(1.0,0.0)),f.x), mix(hash(i+vec2(0.0,1.0)),hash(i+vec2(1.0,1.0)),f.x), f.y); }
    float fbm(vec2 p){ float v=0.0; float a=0.5; for(int i=0;i<4;i++){ v+=a*vnoise(p); p=p*2.03+vec2(1.7); a*=0.5; } return v; }
    void main(){
      vec3 n=normalize(vNormal);
      vec3 grass=mix(uColorLow,uColorHigh,smoothstep(-1.5,5.0,vHeight));
      float n2=fbm(vWorldPos.xz*0.045);
      float bands=sin(vWorldPos.x*0.10+n2*4.0)*sin(vWorldPos.z*0.12-n2*3.5);
      grass=mix(grass,uColorPatch1,smoothstep(0.25,0.85,bands)*0.45);
      grass=mix(grass,uColorPatch2,smoothstep(-0.9,-0.15,bands)*0.35);
      float wave=sin(vWorldPos.x*0.55+uTime*2.1+n2*6.0)*sin(vWorldPos.z*0.48-uTime*1.8+n2*4.0);
      grass*=1.0+wave*0.07*uWindStrength;
      vec2 suv=vWorldPos.xz*uCloudShadowScale+vec2(uTime*0.010,uTime*0.006);
      float cloud=texture2D(uCloudShadow,suv).r;
      grass*=1.0-cloud*uCloudShadowStrength;
      float diff=clamp(dot(n,normalize(uSunDir)),0.0,1.0);
      vec3 col=grass*(0.45+0.75*diff*uSunIntensity);
      col+=vec3(1.0,0.95,0.8)*diff*0.12*uSunIntensity;
      float dist=length(cameraPosition-vWorldPos);
      float fogF=1.0-exp(-uFogDensity*uFogDensity*dist*dist);
      col=mix(col,uFogColor,clamp(fogF,0.0,1.0));
      gl_FragColor=vec4(col,1.0);
    }`
});
const terrainGeo = new THREE.PlaneGeometry(900,900,200,200);
terrainGeo.rotateX(-Math.PI/2);
{
  const pos=terrainGeo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i), z=pos.getZ(i);
    pos.setY(i, terrainHeight(x,z));
  }
  terrainGeo.computeVertexNormals();

// ---------- 程序化音乐 / BGM ----------
class MusicEngine {
  constructor(){
    this.ctx=null; this.started=false; this.musicOn=true;
    this.master=null; this.windGain=null; this.rainGain=null;
    this.noiseBuffer=null; this.chordTimer=null;
    this.scale=[220,261.63,293.66,329.63,392.0,440.0,523.25,587.33];
    this.chords=[
      [220,261.63,329.63,392.0],
      [174.61,220,261.63,329.63],
      [196,246.94,293.66,329.63],
      [164.81,220,261.63,329.63]
    ];
  }
  start(){
    if(this.started) return;
    this.started=true;
    this.ctx=new (window.AudioContext||window.webkitAudioContext)();
    if(this.ctx.resume) this.ctx.resume();
    this.master=this.ctx.createGain();
    this.master.gain.value=this.musicOn?0.5:0.0001;
    this.master.connect(this.ctx.destination);
    this.noiseBuffer=this._createNoiseBuffer();
    this._startWind();
    this._startRain();
    this._scheduleChord(0);
  }
  _createNoiseBuffer(){
    const len=this.ctx.sampleRate*4;
    const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    return buf;
  }
  _startWind(){
    const src=this.ctx.createBufferSource(); src.buffer=this.noiseBuffer; src.loop=true;
    const f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=500; f.Q.value=0.7;
    this.windGain=this.ctx.createGain(); this.windGain.gain.value=0.0;
    src.connect(f); f.connect(this.windGain); this.windGain.connect(this.master);
    src.start();
  }
  _startRain(){
    const src=this.ctx.createBufferSource(); src.buffer=this.noiseBuffer; src.loop=true;
    const f=this.ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=2200;
    this.rainGain=this.ctx.createGain(); this.rainGain.gain.value=0.0;
    src.connect(f); f.connect(this.rainGain); this.rainGain.connect(this.master);
    src.start();
  }
  _scheduleChord(index){
    if(!this.started) return;
    const t=this.ctx.currentTime;
    const dur=8;
    const chord=this.chords[index%this.chords.length];
    chord.forEach(freq=>{
      const osc=this.ctx.createOscillator(); osc.type='triangle'; osc.frequency.value=freq;
      const f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1300;
      const g=this.ctx.createGain();
      g.gain.setValueAtTime(0.0001,t);
      g.gain.linearRampToValueAtTime(0.055,t+2.4);
      g.gain.linearRampToValueAtTime(0.0001,t+dur-0.6);
      osc.connect(f); f.connect(g); g.connect(this.master);
      osc.start(t); osc.stop(t+dur);
    });
    // 五声音阶风铃
    const notes=3+Math.floor(Math.random()*4);
    for(let k=0;k<notes;k++){
      const nt=t+1.0+Math.random()*(dur-1.8);
      const freq=this.scale[Math.floor(Math.random()*this.scale.length)];
      const osc=this.ctx.createOscillator(); osc.type='sine'; osc.frequency.value=freq*2;
      const g=this.ctx.createGain();
      g.gain.setValueAtTime(0.0001,nt);
      g.gain.linearRampToValueAtTime(0.035+Math.random()*0.02,nt+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001,nt+2.5+Math.random()*1.5);
      osc.connect(g); g.connect(this.master);
      osc.start(nt); osc.stop(nt+4);
    }
    this.chordTimer=setTimeout(()=>this._scheduleChord(index+1), dur*1000);
  }
  setWeather(w){
    if(!this.started||!this.ctx) return;
    const now=this.ctx.currentTime;
    this.windGain.gain.setTargetAtTime(0.015+w.wind*0.09, now, 0.6);
    this.rainGain.gain.setTargetAtTime(w.rain*0.18, now, 0.6);
  }
  setMusic(on){
    this.musicOn=on;
    if(!this.started) return;
    this.master.gain.setTargetAtTime(on?0.5:0.0001, this.ctx.currentTime, 0.2);
  }
}

// 手机端虚拟摇杆
let joyPointerId=null;
function joystickVector(e){
  const r=joystickEl.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  const maxR=r.width/2;
  const dx=e.clientX-cx, dy=e.clientY-cy;
  const len=Math.sqrt(dx*dx+dy*dy);
  const cl=Math.min(len, maxR)/maxR;
  return { x: len>0 ? (dx/len)*cl : 0, y: len>0 ? (dy/len)*cl : 0 };
}
function updateJoystickKnob(){
  joystickKnob.style.transform=`translate(${input.joyX*30}px, ${-input.joyY*30}px)`;
}
joystickEl.addEventListener('pointerdown', e=>{
  joyPointerId=e.pointerId;
  if(joystickEl.setPointerCapture) joystickEl.setPointerCapture(e.pointerId);
  const v=joystickVector(e);
  input.joyX=v.x; input.joyY=-v.y;
  updateJoystickKnob();
});
joystickEl.addEventListener('pointermove', e=>{
  if(e.pointerId!==joyPointerId) return;
  const v=joystickVector(e);
  input.joyX=v.x; input.joyY=-v.y;
  updateJoystickKnob();
});
function releaseJoystick(e){
  if(e.pointerId!==joyPointerId) return;
  joyPointerId=null;
  input.joyX=0; input.joyY=0;
  updateJoystickKnob();
}
joystickEl.addEventListener('pointerup', releaseJoystick);
joystickEl.addEventListener('pointercancel', releaseJoystick);

// 画质面板
const qualityBtns=[...document.querySelectorAll('#panel button[data-q]')];
function setQuality(q){
  currentQuality=q;
  const preset=QUALITY_PRESETS[q];
  renderer.setPixelRatio(preset.pixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  if(composer.setPixelRatio) composer.setPixelRatio(preset.pixelRatio);
  else if(composer._pixelRatio !== undefined) composer._pixelRatio = preset.pixelRatio;
  composer.setSize(window.innerWidth, window.innerHeight);
  qualityBtns.forEach(b=>b.classList.toggle('active', b.dataset.q===q));
}
qualityBtns.forEach(b=>b.addEventListener('click', ()=>{ setQuality(b.dataset.q); }));

const rotateSkipBtn=document.getElementById('rotateSkipBtn');

// ---------- 天气系统 ----------
const weatherStates=[
  {name:'晴朗', cloudCover:0.32, fogDensity:0.0032, rain:0.0, sunIntensity:1.05, wind:0.38, fogParticle:0.10,
   skyTop:0x3b8fd4, skyHorizon:0xbfe0ff, cloudColor:0xffffff, fogColor:0xcfe8ff},
  {name:'多云', cloudCover:0.72, fogDensity:0.007, rain:0.0, sunIntensity:0.6, wind:0.7, fogParticle:0.30,
   skyTop:0x5d7f9e, skyHorizon:0xc8d8e8, cloudColor:0xe8edf2, fogColor:0xcfdde8},
  {name:'小雨', cloudCover:0.92, fogDensity:0.014, rain:0.85, sunIntensity:0.35, wind:0.95, fogParticle:0.55,
   skyTop:0x4f667d, skyHorizon:0xa8bccd, cloudColor:0xb8c4d0, fogColor:0xaebfd0}
];
const current={
  cloudCover:0.32, fogDensity:0.0032, rain:0, sunIntensity:1.05, wind:0.38, fogParticle:0.10
};
const currentColor={
  skyTop:new THREE.Color(weatherStates[0].skyTop),
  skyHorizon:new THREE.Color(weatherStates[0].skyHorizon),
  cloudColor:new THREE.Color(weatherStates[0].cloudColor),
  fogColor:new THREE.Color(weatherStates[0].fogColor)
};
let weatherIndex=0, weatherTimer=0, weatherDuration=22;

function updateWeather(dt){
  weatherTimer+=dt;
  if(weatherTimer>weatherDuration){
    weatherTimer=0;
    weatherIndex=(weatherIndex+1)%weatherStates.length;
    weatherDuration=20+Math.random()*16;
  }
  const target=weatherStates[weatherIndex];
  weatherEl.textContent='天气 · '+target.name;
  current.cloudCover=damp(current.cloudCover,target.cloudCover,0.5,dt);
  current.fogDensity=damp(current.fogDensity,target.fogDensity,0.6,dt);
  current.rain=damp(current.rain,target.rain,0.5,dt);
  current.sunIntensity=damp(current.sunIntensity,target.sunIntensity,0.6,dt);
  current.wind=damp(current.wind,target.wind,0.5,dt);
  current.fogParticle=damp(current.fogParticle,target.fogParticle,0.6,dt);
  const c=new THREE.Color(target.skyTop); currentColor.skyTop.lerp(c, 1-Math.exp(-dt*0.8));
  const c2=new THREE.Color(target.skyHorizon); currentColor.skyHorizon.lerp(c2, 1-Math.exp(-dt*0.8));
  const c3=new THREE.Color(target.cloudColor); currentColor.cloudColor.lerp(c3, 1-Math.exp(-dt*0.8));
  const c4=new THREE.Color(target.fogColor); currentColor.fogColor.lerp(c4, 1-Math.exp(-dt*0.8));
}

// ---------- 流场 / 花瓣群运动 ----------
const flow={
  pos:new THREE.Vector3(0, terrainHeight(0,0)+6, 0),
  vel:new THREE.Vector3(1,0,0),
  yaw:Math.PI*0.5,
  pitch:0,
  speed:0
};
const trail=[];
let trailTimer=0;
const UP=new THREE.Vector3(0,1,0);

function updateFlow(dt){
  const keyboardForward = input.forward ? 1.0 : 0.0;
  const keyboardBack = input.back ? -0.85 : 0.0;
  const joystickForward = input.joyY > 0.05 ? input.joyY : 0.0;
  const joystickBack = input.joyY < -0.05 ? input.joyY : 0.0;
  const targetSpeed = (keyboardForward + joystickForward) * 10.0 + (keyboardBack + joystickBack) * 4.5;
  flow.targetSpeed = clamp(targetSpeed, -4.5, 10.0);
  flow.speed=damp(flow.speed,flow.targetSpeed,1.6,dt);
  const keyboardTurn = (input.left?1.0:0.0) - (input.right?1.0:0.0);
  const turnInput = clamp(keyboardTurn - input.joyX, -1.0, 1.0);
  const speedFactor = Math.abs(flow.speed)/10;
  const turnRate = 0.55 + 0.75 * speedFactor;
  flow.yaw += turnInput * turnRate * dt;
  if(Math.abs(turnInput)<0.01 && flow.speed<0.5){
    // 静止时极缓慢的环绕，保持电影感
    flow.yaw += Math.sin(time*0.15)*0.03*dt;
  }
  flow.pitch=damp(flow.pitch,0,2.0,dt);
  // 边界转向
  const p=flow.pos;
  if(p.x>115) flow.yaw+=dt*0.7;
  if(p.x<-115) flow.yaw-=dt*0.7;
  if(p.z>115) flow.yaw+=dt*0.7;
  if(p.z<-115) flow.yaw-=dt*0.7;
  const dir=new THREE.Vector3(Math.sin(flow.yaw)*Math.cos(flow.pitch), Math.sin(flow.pitch), Math.cos(flow.yaw)*Math.cos(flow.pitch));
  flow.vel.lerp(dir, 1-Math.exp(-dt*2.2));
  p.addScaledVector(flow.vel, flow.speed*dt);
  const gy=terrainHeight(p.x,p.z);
  const hover=4.5+(1-flow.speed/10)*2.5;
  p.y=damp(p.y, gy+hover, 4.0, dt);
  // 记录轨迹
  trailTimer+=dt;
  if(trailTimer>0.09){
    trailTimer=0;
    trail.push(p.clone());
    if(trail.length>70) trail.shift();
  }
}

function updatePetals(dt){
  const m=new THREE.Matrix4(), q=new THREE.Quaternion(), s=new THREE.Vector3(), target=new THREE.Vector3(), dir=new THREE.Vector3();
  const vNorm=new THREE.Vector3();
  for(let i=0;i<PETAL_COUNT;i++){
    const sw=1.4+(i%6)*0.42;
    target.set(
      flow.pos.x + Math.sin(time*1.15+i*1.7)*sw,
      flow.pos.y + Math.cos(time*0.9+i*1.3)*1.1 + Math.sin(time*1.6+i)*0.6,
      flow.pos.z + Math.cos(time*0.8+i*1.1)*sw
    );
    petalPos[i].lerp(target, 1-Math.exp(-dt*4.5));
    dir.copy(target).sub(petalPos[i]);
    const dirSign = flow.speed < -0.05 ? -1.0 : 1.0;
    vNorm.copy(flow.vel).multiplyScalar(0.6*dirSign);
    dir.add(vNorm);
    dir.normalize();
    if(dir.lengthSq()<0.0001) dir.set(0,1,0);
    q.setFromUnitVectors(UP, dir);
    q.multiply(new THREE.Quaternion().setFromAxisAngle(UP, time*2.2+i*1.7));
    q.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), Math.sin(time*3.1+i)*0.35));
    const sc=0.9+(i%5)*0.16;
    s.set(sc,sc,sc);
    m.compose(petalPos[i],q,s);
    petals.setMatrixAt(i,m);
  }
  petals.instanceMatrix.needsUpdate=true;
}

function easeInOut(t){ return t*t*(3-2*t); }
function computeGrowth(x,z){
  let minD=1e18;
  for(let i=0;i<trail.length;i++){
    const dx=x-trail[i].x, dz=z-trail[i].z;
    const d2=dx*dx+dz*dz;
    if(d2<minD) minD=d2;
  }
  const r=5.2;
  return clamp(1-Math.sqrt(minD)/r, 0, 1);
}
const zeroMatrix=new THREE.Matrix4().makeScale(0,0,0);
function updateFlowers(dt){
  const m=new THREE.Matrix4(), p=new THREE.Vector3(), q=new THREE.Quaternion(), s=new THREE.Vector3();
  for(let i=0;i<FLOWER_COUNT;i++){
    const f=flowerPositions[i];
    const g=computeGrowth(f.x,f.z);
    flowerGrown[i]=Math.max(flowerGrown[i], g);
    const gr=easeInOut(flowerGrown[i]);
    if(gr<0.002){
      stems.setMatrixAt(i, zeroMatrix);
      for(let h=0;h<headMeshes.length;h++) headMeshes[h].setMatrixAt(i, zeroMatrix);
      continue;
    }
    const sc=flowerScale[i];
    const type=flowerTypes[i];
    q.setFromAxisAngle(UP, flowerYaw[i]);
    p.set(f.x, f.y+0.03, f.z);
    s.set(sc*0.45, gr*sc, sc*0.45);
    m.compose(p,q,s);
    stems.setMatrixAt(i,m);
    p.set(f.x, f.y+gr*sc*0.78+headMountY[type], f.z);
    s.set(gr*sc, gr*sc, gr*sc);
    m.compose(p,q,s);
    for(let h=0;h<headMeshes.length;h++){
      headMeshes[h].setMatrixAt(i, h===type ? m : zeroMatrix);
    }
  }
  stems.instanceMatrix.needsUpdate=true;
  for(let h=0;h<headMeshes.length;h++) headMeshes[h].instanceMatrix.needsUpdate=true;
}

function updateRain(dt){
  const arr=rainGeo.attributes.position.array;
  for(let i=0;i<RAIN_COUNT;i++){
    arr[i*3]+=current.wind*dt*2.0;
    arr[i*3+1]-=dt*(30+current.rain*28);
    arr[i*3+2]+=current.wind*dt*1.6;
    const gy=terrainHeight(arr[i*3], arr[i*3+2]);
    if(arr[i*3+1]<gy-0.5){
      arr[i*3]=camera.position.x+(Math.random()-0.5)*130;
      arr[i*3+1]=camera.position.y+22+Math.random()*32;
      arr[i*3+2]=camera.position.z+(Math.random()-0.5)*130;
    }
  }
  rainGeo.attributes.position.needsUpdate=true;
  rainMat.opacity=current.rain*0.7;
  rain.visible=current.rain>0.04;
}

function updateFogParticles(dt){
  const arr=fogGeo.attributes.position.array;
  for(let i=0;i<FOG_PARTICLE_COUNT;i++){
    arr[i*3]+=(current.wind*2.2+Math.sin(time*0.13+i)*0.25)*dt;
    arr[i*3+1]+=Math.sin(time*0.45+i*1.3)*0.12*dt;
    arr[i*3+2]+=(current.wind*1.3+Math.cos(time*0.11+i)*0.25)*dt;
    const gy=terrainHeight(arr[i*3], arr[i*3+2]);
    if(arr[i*3+1]<gy+0.2 || arr[i*3+1]>gy+4.5){
      arr[i*3+1]=gy+0.5+Math.random()*2.8;
    }
    if(Math.abs(arr[i*3]-camera.position.x)>100) arr[i*3]=camera.position.x+(Math.random()-0.5)*100;
    if(Math.abs(arr[i*3+2]-camera.position.z)>100) arr[i*3+2]=camera.position.z+(Math.random()-0.5)*100;
  }
  fogGeo.attributes.position.needsUpdate=true;
  fogMat.opacity=0.05+current.fogParticle*0.5;
}

// ---------- 相机 / 景深 ----------
let currentAperture=0.0;
function updateCamera(dt){
  const stopFactor=clamp(1-Math.abs(flow.speed)/10, 0, 1);
  const dist=13-stopFactor*6.2;
  const camAngle=flow.yaw+Math.PI+(stopFactor*Math.sin(time*0.16)*0.7);
  const desired=new THREE.Vector3(
    flow.pos.x+Math.sin(camAngle)*dist+pointer.x*3.5,
    flow.pos.y+3.0+stopFactor*1.6+pointer.y*1.5,
    flow.pos.z+Math.cos(camAngle)*dist
  );
  const gy=terrainHeight(desired.x, desired.z);
  if(desired.y<gy+1.2) desired.y=gy+1.2;
  camera.position.lerp(desired, 1-Math.exp(-dt*3.2));
  camera.lookAt(flow.pos.x, flow.pos.y+0.8, flow.pos.z);
  const focusDist=camera.position.distanceTo(flow.pos);
  // 仅在几乎完全停下时开启轻微景深，移动时保持清晰
  const dofActive = stopFactor > 0.85;
  bokehPass.enabled = dofActive;
  const bu=bokehPass.uniforms||bokehPass.materialBokeh.uniforms;
  if(dofActive){
    const targetAperture = 0.0002 + (stopFactor-0.85)*0.004;
    currentAperture=damp(currentAperture, targetAperture, 2.5, dt);
    bu.focus.value=focusDist;
    bu.aperture.value=currentAperture;
    bu.maxblur.value=0.002;
  } else {
    currentAperture=damp(currentAperture, 0.0, 3.0, dt);
    bu.aperture.value=currentAperture;
  }
}

// ---------- 每帧 uniform 更新 ----------
function updateUniforms(){
  skyMat.uniforms.uTime.value=time;
  skyMat.uniforms.uSunDir.value.copy(sunDir);
  skyMat.uniforms.uSunIntensity.value=current.sunIntensity;
  skyMat.uniforms.uSkyTop.value.copy(currentColor.skyTop);
  skyMat.uniforms.uSkyHorizon.value.copy(currentColor.skyHorizon);

  cloudMat.uniforms.uTime.value=time;
  cloudMat.uniforms.uSunDir.value.copy(sunDir);
  cloudMat.uniforms.uSunIntensity.value=current.sunIntensity;
  cloudMat.uniforms.uCloudColor.value.copy(currentColor.cloudColor);
  cloudMat.uniforms.uSkyColor.value.copy(currentColor.skyHorizon);
  cloudMat.uniforms.uCoverage.value=current.cloudCover;
  cloudMat.uniforms.uDensity.value=0.75+current.cloudCover*0.8;
  const qp=QUALITY_PRESETS[currentQuality];
  cloudMat.uniforms.uStepCount.value = current.cloudCover>0.6 ? qp.maxCloudSteps : qp.cloudSteps;

  terrainMat.uniforms.uTime.value=time;
  terrainMat.uniforms.uSunDir.value.copy(sunDir);
  terrainMat.uniforms.uSunIntensity.value=current.sunIntensity;
  terrainMat.uniforms.uWindStrength.value=current.wind;
  terrainMat.uniforms.uCloudShadowStrength.value=0.12+current.cloudCover*0.40;
  terrainMat.uniforms.uFogColor.value.copy(currentColor.fogColor);
  terrainMat.uniforms.uFogDensity.value=current.fogDensity;

  grassMat.uniforms.uTime.value=time;
  grassMat.uniforms.uWind.value=0.22+current.wind*0.55;
  grassMat.uniforms.uSunDir.value.copy(sunDir);
  grassMat.uniforms.uSunIntensity.value=current.sunIntensity;
  grassMat.uniforms.uFogColor.value.copy(currentColor.fogColor);
  grassMat.uniforms.uFogDensity.value=current.fogDensity;
  grassMat.uniforms.uCloudShadowStrength.value=0.12+current.cloudCover*0.40;

  scene.fog.color.copy(currentColor.fogColor);
  scene.fog.density=current.fogDensity;
  scene.background.copy(currentColor.fogColor);

  sunLight.intensity=1.2+current.sunIntensity*2.2;
  sunLight.color.setHSL(0.11, 0.55, 0.85+current.sunIntensity*0.1);

  colorPass.uniforms.uTime.value=time;
  colorPass.uniforms.uVignette.value=0.22+current.rain*0.12;
  colorPass.uniforms.uSaturation.value=1.08+current.sunIntensity*0.10;

  if(music.started && time-lastMusicUpdate>0.6){
    music.setWeather(current);
    lastMusicUpdate=time;
  }
}

// ---------- 主循环 ----------
const clock=new THREE.Clock();
let time=0;
let lastMusicUpdate=0;
let fpsFrames=0, fpsTime=0;
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(), 0.05);
  time+=dt;
  updateWeather(dt);
  updateFlow(dt);
  updatePetals(dt);
  updateFlowers(dt);
  updateRain(dt);
  updateFogParticles(dt);
  updateCamera(dt);
  updateUniforms();
  composer.render();
  fpsFrames++; fpsTime+=dt;
  if(fpsTime>=0.6){
    fpsEl.textContent = Math.round(fpsFrames/fpsTime)+' FPS';
    fpsFrames=0; fpsTime=0;
  }
}

window.addEventListener('resize',()=>{
  applyCameraFov();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
